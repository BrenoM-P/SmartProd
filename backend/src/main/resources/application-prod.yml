# Produção: PostgreSQL em nuvem. Credenciais SEMPRE por variável de ambiente (o repositório é público).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  jwt:
    # Sem valor padrão de propósito: sem JWT_SECRET (mínimo 32 caracteres) a aplicação não deve subir.
    secret: ${JWT_SECRET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
